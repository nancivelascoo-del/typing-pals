name: QA and deploy

# Every push and pull request runs the QA checks at iPad landscape, iPad portrait and phone sizes.
# The site is published to GitHub Pages only from main, and only after every check passes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: QA ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "sweep · iPad landscape 1024x768", cmd: "node qa-sweep.js", vp: ipad }
          - { name: "sweep · iPad portrait 820x1180", cmd: "node qa-sweep.js", vp: ipad-portrait }
          - { name: "sweep · phone 390x844", cmd: "node qa-sweep.js", vp: phone }
          - { name: "letters + ninja flows", cmd: "node full-test.js chromium", vp: "" }
          - { name: "reading games v1", cmd: "node reading-test.js", vp: "" }
          - { name: "reading games v2", cmd: "node reading-v2-test.js", vp: "" }
          - { name: "audio + progression", cmd: "node audio-progress-test.js", vp: "" }
          - { name: "offline install", cmd: "node live-offline.js", vp: "" }
          - { name: "lesson data", cmd: "node check-data.js", vp: "" }
    env:
      BASE: http://127.0.0.1:8765/typing-pals/
      SHOTS: ${{ github.workspace }}/test-results
      CHROME_PATH: ""
      VP: ${{ matrix.vp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Install Playwright (uses the runner's Chrome if present)
        working-directory: test
        timeout-minutes: 20
        run: |
          npm ci
          if [ "${{ matrix.vp }}${{ matrix.cmd }}" = "node check-data.js" ]; then exit 0; fi
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; /usr/bin/google-chrome --version
          else npx playwright install --with-deps chromium; fi
      - name: Serve the site at /typing-pals/ (same path as GitHub Pages)
        run: |
          mkdir -p /tmp/site && ln -s "$GITHUB_WORKSPACE" /tmp/site/typing-pals
          cd /tmp/site && nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$BASE" > /dev/null && exit 0; sleep 1; done; exit 1
      - name: Run ${{ matrix.name }}
        working-directory: test
        run: ${{ matrix.cmd }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ strategy.job-index }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Collect only the site files
        run: |
          mkdir _site
          cp -r index.html app.js data.js clips.js phonics.js style.css sw.js manifest.webmanifest .nojekyll audio icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    name: Check the live site works offline
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: ""
      SHOTS: ${{ github.workspace }}/test-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: test
        timeout-minutes: 20
        run: |
          npm ci
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else npx playwright install --with-deps chromium; fi
      - name: Live site serves this commit's sw.js and plays offline
        working-directory: test
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for i in $(seq 1 20); do curl -s "${URL}sw.js?$(date +%s)" | cmp -s - ../sw.js && break; sleep 15; done
          node live-offline.js "$URL" chromium
